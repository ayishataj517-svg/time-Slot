<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: navy;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #2874A6;
            color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #eaf2f8;
        }
    </style>
</head>

<body>

<h1>Class Timetable</h1>

<table>
    <tr>
        <th>Day</th>
        <th>Time Slot</th>
        <th>Subject</th>
        <th>Faculty Name</th>
        <th>Classroom</th>
    </tr>

    {% for slot in slots %}
    <tr>
        <td>{{ slot.day }}</td>
        <td>{{ slot.start_time }} - {{ slot.end_time }}</td>
        <td>{{ slot.subject_name }}</td>
        <td>{{ slot.faculty_name }}</td>
        <td>{{ slot.classroom }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No timetable records available.</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
